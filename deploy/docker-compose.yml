# Production stack for the Construction PM Assistant — deployed on the
# 8GB Arm VPS (n8n2.ordrnow.com). Mirrors the live /home/ubuntu/n8n-compose/compose.yaml.
#
# Topology: Traefik (TLS) -> n8n (127.0.0.1:5678) + co-located PostgreSQL.
# - n8n keeps its own internal SQLite storage (n8n_data). Do NOT add DB_TYPE_*
#   env vars unless you also want to move n8n's own store to Postgres.
# - postgres is the APP database. It has NO published port — only n8n (and
#   `docker exec` backup via migrate.sh/backup.sh) can reach it.
# - n8n image is PINNED (deliberate upgrades, see backend/DEPLOY.md §8).
#
# Secrets come from .env next to this file (POSTGRES_PASSWORD, GMAIL_USER,
# SSL_EMAIL, SUBDOMAIN, DOMAIN_NAME, GENERIC_TIMEZONE).

services:
  traefik:
    image: "traefik"
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  n8n:
    # Pinned deliberately — see backend/DEPLOY.md §8 for the upgrade runbook.
    image: docker.n8n.io/n8nio/n8n:2.35.7
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=web,websecure
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      - traefik.http.routers.n8n.middlewares=n8n@docker
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      # PM-assistant env used by the gateway/email Code nodes:
      - GMAIL_USER=${GMAIL_USER}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://n8n2.ordrnow.com}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Deliberately NO `ports:` mapping — only n8n (and the backup job, via
    # `docker exec`) can reach it over the Docker network. Never expose 5432
    # to the public internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  n8n_data:
  traefik_data:
  pgdata:
