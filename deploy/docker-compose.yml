# Co-located n8n + PostgreSQL for the Construction PM Assistant.
#
# The `postgres` service is the APP database (the n8n "Supabase PostgreSQL"
# credential points at host `postgres`, port 5432). n8n keeps its own internal
# SQLite storage — do NOT add DB_TYPE_* env vars unless you also want to move
# n8n's own store to Postgres (out of scope here).
#
# If you already run n8n from an existing compose file, just merge the
# `postgres` service + the `pgdata` volume into that file (same network).

services:
  n8n:
    # Pinned deliberately: :latest means "whatever shipped today" and n8n has
    # breaking changes between majors. Bump this tag only when you choose to
    # upgrade (see "Upgrading" in backend/DEPLOY.md).
    image: docker.n8n.io/n8nio/n8n:2.35.7
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n2.ordrnow.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - GMAIL_USER=${GMAIL_USER}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://n8n2.ordrnow.com}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Deliberately NO `ports:` mapping — only n8n (and the backup job, via
    # `docker exec`) can reach it over the Docker network. Never expose 5432
    # to the public internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  n8n_data:
  pgdata:
