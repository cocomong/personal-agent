<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <!-- Background -->
  <rect width="500" height="200" rx="12" fill="#ffffff"/>

  <!-- House outline only -->
  <g transform="translate(150, 10)" fill="none" stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Roof with overhang -->
    <polygon points="-20,70 90,5 200,70"/>
    <!-- Roof fascia line -->
    <line x1="-20" y1="70" x2="200" y2="70"/>
    <!-- Main body/walls -->
    <rect x="10" y="70" width="160" height="100" rx="2"/>
    <!-- Chimney -->
    <rect x="140" y="18" width="18" height="35" rx="1"/>
    <rect x="137" y="15" width="24" height="5" rx="1"/>
    <!-- Door -->
    <rect x="75" y="120" width="30" height="50" rx="2"/>
    <!-- Left window -->
    <rect x="30" y="95" width="25" height="22" rx="1"/>
    <line x1="42.5" y1="95" x2="42.5" y2="117"/>
    <line x1="30" y1="106" x2="55" y2="106"/>
    <!-- Right window -->
    <rect x="125" y="95" width="25" height="22" rx="1"/>
    <line x1="137.5" y1="95" x2="137.5" y2="117"/>
    <line x1="125" y1="106" x2="150" y2="106"/>
  </g>

  <!-- Company name overlay centered on house -->
  <text x="250" y="118" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#000000" text-anchor="middle" letter-spacing="3" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round;">IREH</text>

  <!-- Tagline overlay below -->
  <text x="250" y="142" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#000000" text-anchor="middle" letter-spacing="8" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round;">CONSTRUCTION</text>
</svg>
